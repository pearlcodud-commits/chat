<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매너 채팅 챌린지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/*
VOICE: 밝고 신나는 교실 게임, 초등 4학년이 바로 이해하는 말투
IDEA: 진짜 메신저 화면 — 단톡방, 게임 채팅, 댓글창, 화상 수업이 번갈아 나온다
PICTURE: 화면 가운데 채팅창 자체가 게임판, 위에는 매너 온도계
COLOUR: 플랫폼마다 고유 색 (노란 말풍선, 어두운 게임 채팅, 주황 장터), 공통 강조는 매너 온도 분홍
TYPE: Jua(제목·버튼) + 시스템 고딕(본문)
*/
:root{color-scheme:light dark;--bg:light-dark(#f3efe6,#17161a);--ink:light-dark(#1d1b20,#f1eef4);--card:light-dark(#ffffff,#232129);--line:light-dark(#e2ddd2,#3a3742);--muted:light-dark(#6b6670,#aaa4b2);--hot:#ff4f6d;--good:#1fb57a;--fun:#ff9f1c;--lazy:#8a8f98}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.j{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:44px}
button:focus-visible{outline:3px solid #4c7dff;outline-offset:2px}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:10px}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 12px;position:relative}
.hud .rd{font-size:15px;white-space:nowrap}
.temp{flex:1;display:flex;flex-direction:column;gap:3px}
.temp .top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.temp .top b{color:var(--ink);font-size:17px;white-space:nowrap}
.bar{height:10px;border-radius:9px;background:light-dark(#eee9df,#34313b);overflow:hidden}
.bar i{display:block;height:100%;width:45%;border-radius:9px;background:#3ec07c;transition:width .5s ease,background .5s}
.combo{font-size:14px;white-space:nowrap;padding:4px 9px;border-radius:10px;background:light-dark(#fff1d6,#3b3020);color:light-dark(#a25d00,#ffc46b);opacity:.35;transition:opacity .2s,transform .2s}
.combo.on{opacity:1;transform:scale(1.06)}
.iconbtn{background:light-dark(#f0ece4,#2f2c36);color:var(--ink);min-width:44px;padding:0 8px;font-size:18px}
.pop{position:absolute;right:120px;top:-6px;font-size:20px;pointer-events:none;opacity:0}
.pop.go{animation:pop 1s ease forwards}
@keyframes pop{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}

/* Chat window */
.win{flex:1;display:flex;flex-direction:column;margin-top:10px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--cbg);color:var(--cink);min-height:0;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.wh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--hbg);color:var(--hink)}
.wh .pi{font-size:22px}
.wh .nm{font-weight:700;font-size:16px;line-height:1.2}
.wh .sub{font-size:12px;opacity:.75}
.wh .tag{margin-left:auto;font-size:12px;padding:3px 9px;border-radius:9px;background:rgba(0,0,0,.12);white-space:nowrap}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.ctx{align-self:center;max-width:94%;text-align:center;font-size:14px;line-height:1.45;background:var(--sbg);color:var(--sink);padding:8px 12px;border-radius:12px}
.ctx b{display:block;font-size:12px;opacity:.8;margin-bottom:2px}
.sys{align-self:center;font-size:13px;background:var(--sbg);color:var(--sink);padding:5px 12px;border-radius:10px;max-width:92%;text-align:center}
.row{display:flex;gap:8px;align-items:flex-start;opacity:0;transform:translateY(8px);transition:opacity .25s ease,transform .25s ease}
.row.in{opacity:1;transform:none}
.row.me{flex-direction:row-reverse}
.av{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--avbg);flex:none}
.row .who{font-size:12px;opacity:.8;margin:0 0 3px 2px}
.row .who small{opacity:.75}
.bub{max-width:76%;padding:8px 12px;border-radius:4px 16px 16px 16px;background:var(--pbub);color:var(--pink);font-size:15.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.me .bub{border-radius:16px 4px 16px 16px;background:var(--mbub);color:var(--mink)}
.col{display:flex;flex-direction:column;max-width:80%}
.me .col{align-items:flex-end}
.col .bub{max-width:100%}
.tm{font-size:11px;opacity:.6;align-self:flex-end;white-space:nowrap}
.typing .bub{display:flex;gap:4px;padding:12px 14px}
.typing .bub span{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.4;animation:dot 1s infinite}
.typing .bub span:nth-child(2){animation-delay:.15s}.typing .bub span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:.9;transform:translateY(-3px)}}

/* Bottom panel */
.panel{background:var(--card);color:var(--ink);border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;max-height:52%;overflow-y:auto}
.ph{font-size:13px;color:var(--muted);text-align:center}
.ch{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;background:light-dark(#f6f3ec,#2c2933);color:var(--ink);border:2px solid transparent;transition:border-color .15s,background .15s;line-height:1.4;font-size:15px}
.ch:hover{border-color:#4c7dff}
.ch .k{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--card);font-size:14px;font-weight:700}
.ch[disabled]{cursor:default}
.ch.pick{border-color:#4c7dff;background:light-dark(#e9efff,#2a3150)}
.ch.dim{opacity:.4}
.fb{border-radius:16px;padding:12px 14px;background:light-dark(#f6f3ec,#2c2933);animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fb .h{display:flex;align-items:center;gap:8px;font-size:19px}
.fb .d{margin-left:auto;font-size:18px;white-space:nowrap}
.fb p{margin:6px 0 0;font-size:15px}
.fb .best{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--card);border-left:4px solid var(--good)}
.k-good{color:var(--good)}.k-fun{color:var(--fun)}.k-lazy{color:var(--lazy)}.k-hot{color:var(--hot)}
.next{background:#4c7dff;color:#fff;font-size:18px;padding:10px}
.next:hover{background:#3a69ea}

/* Screens */
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:18px 8px;text-align:center;overflow-y:auto}
.hero{font-size:clamp(34px,8vw,48px);line-height:1.08;margin:0}
.lead{font-size:16px;color:var(--muted);margin:0 auto;max-width:28em}
.phones{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.chip{font-size:14px;padding:6px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.big{background:#ff4f6d;color:#fff;font-size:22px;padding:12px 28px;align-self:center;border-radius:18px;box-shadow:0 5px 0 #c9324d}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c9324d}
.opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);padding:6px 14px;font-size:15px}
.opt.on{border-color:#ff4f6d;color:#ff4f6d}
.rule{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:420px;margin:0 auto;font-size:14px;text-align:left}
.rule div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}

.res{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px}
.grade{text-align:center}
.grade .e{font-size:56px;line-height:1}
.grade .g{font-size:30px;margin-top:4px}
.grade .t{font-size:18px;color:var(--muted)}
.st{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.5em;gap:6px 8px;align-items:center;font-size:14px}
.st .b{height:12px;border-radius:8px;background:light-dark(#eee9df,#34313b);overflow:hidden}
.st .b i{display:block;height:100%;border-radius:8px}
.st .n{text-align:right}
.box{border-radius:14px;padding:10px 12px;background:light-dark(#f6f3ec,#2c2933);font-size:15px}
.box h3{margin:0 0 4px;font-size:17px}
.box p{margin:0}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{font-size:13px;padding:4px 8px;border-radius:9px;background:var(--card);border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Platform themes */
.p-kakao{--cbg:#b2c7da;--cink:#1d1d1d;--hbg:#a5bbcf;--hink:#1d1d1d;--pbub:#fff;--pink:#1d1d1d;--mbub:#fee500;--mink:#1d1d1d;--sbg:rgba(0,0,0,.14);--sink:#1d1d1d;--avbg:#e9eef3}
.p-open{--cbg:#c9c2ea;--cink:#1d1d1d;--hbg:#6c5ce7;--hink:#fff;--pbub:#fff;--pink:#1d1d1d;--mbub:#fee500;--mink:#1d1d1d;--sbg:rgba(0,0,0,.13);--sink:#1d1d1d;--avbg:#ece9fb}
.p-game{--cbg:#313338;--cink:#dbdee1;--hbg:#1e1f22;--hink:#f2f3f5;--pbub:#2b2d31;--pink:#dbdee1;--mbub:#5865f2;--mink:#fff;--sbg:#3f4147;--sink:#dbdee1;--avbg:#404249}
.p-video{--cbg:#fff;--cink:#0f0f0f;--hbg:#ff3d3d;--hink:#fff;--pbub:#f2f2f2;--pink:#0f0f0f;--mbub:#e7f0ff;--mink:#0f0f0f;--sbg:#f6f6f6;--sink:#333;--avbg:#ffe3e3}
.p-board{--cbg:#f4f6f9;--cink:#1d2330;--hbg:#2f6fde;--hink:#fff;--pbub:#fff;--pink:#1d2330;--mbub:#dfeaff;--mink:#1d2330;--sbg:#e5ebf4;--sink:#2a3346;--avbg:#e5ebf4}
.p-meet{--cbg:#202124;--cink:#e8eaed;--hbg:#2d2e31;--hink:#e8eaed;--pbub:#3c4043;--pink:#e8eaed;--mbub:#8ab4f8;--mink:#11203b;--sbg:#35363a;--sink:#e8eaed;--avbg:#3c4043}
.p-market{--cbg:#fff8f3;--cink:#212124;--hbg:#ff7e36;--hink:#fff;--pbub:#f2f3f6;--pink:#212124;--mbub:#ff7e36;--mink:#fff;--sbg:#ffe9dc;--sink:#6b3a1c;--avbg:#ffe9dc}
.p-sns{--cbg:#fafafa;--cink:#111;--hbg:linear-gradient(90deg,#f58529,#dd2a7b,#8134af);--hink:#fff;--pbub:#fff;--pink:#111;--mbub:#efe3ff;--mink:#111;--sbg:#f0eef5;--sink:#333;--avbg:#fde6f1}
.p-sns .wh{background:var(--hbg)}

@media(max-width:420px){.hud{flex-wrap:wrap}.temp{order:3;flex-basis:100%}.pop{right:20px}.bub{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="hud" id="hud" hidden>
    <div class="rd j" id="rd">1 / 10</div>
    <div class="temp">
      <div class="top"><span>매너 온도</span><b id="tv">36.5°C</b></div>
      <div class="bar"><i id="tb"></i></div>
    </div>

    <button class="iconbtn" id="snd" aria-label="소리 켜기/끄기">🔊</button>

</div>

<script>
{
/* ============ 기본 데이터 ============ */
const NAMES=['서아','지호','하루','유나','도하','예서','이도','리아','시후','주아','우주','수아','태오','라희','해리','소이','나루','미오','다오','로하'];

const PLAT={
  kakao:{i:'💬',n:'메신저'},open:{i:'🌐',n:'오픈채팅'},game:{i:'🎮',n:'게임 팀 채팅'},
  video:{i:'📺',n:'동영상 댓글'},board:{i:'📋',n:'게시판'},meet:{i:'🎥',n:'화상 수업·회의'},
  market:{i:'🥕',n:'동네 중고거래'},sns:{i:'📸',n:'SNS 댓글'}
};
const TAGS={
  공손:{n:'공손한 말씨',tip:'상대가 보이지 않아도 얼굴을 보고 말하듯 예의 바르게 말해요.',pledge:'저는 화가 나도 공손한 말로 내 생각을 전할 거예요.'},
  주제:{n:'주제 지키기',tip:'대화 주제와 관련 없는 말이나 그림말(이모티콘)을 반복하지 않아요.',pledge:'저는 대화 주제에 맞는 말을 하고 도배를 하지 않을 거예요.'},
  사실:{n:'사실 확인',tip:'자료나 소식을 퍼뜨리기 전에 출처와 사실인지 먼저 확인해요.',pledge:'저는 글이나 자료를 올리기 전에 항상 사실인지 확인할 거예요.'},
  허락:{n:'허락 구하기',tip:'사진·동영상·다른 사람의 글이나 그림은 공유하기 전에 허락을 구해요.',pledge:'저는 사진이나 자료를 올리기 전에 꼭 허락을 구할 거예요.'},
  배려:{n:'배려하는 마음',tip:'상대의 상황과 기분을 먼저 생각하고, 따뜻한 말을 건네요.',pledge:'저는 상대의 기분을 먼저 생각하며 따뜻하게 말할 거예요.'},
  안전:{n:'안전 지키기',tip:'모르는 사람에게 개인 정보를 알려 주지 않고, 수상한 링크는 누르지 않아요.',pledge:'저는 내 개인 정보를 소중히 지키고 수상한 링크는 누르지 않을 거예요.'}
};
const KIND={
  good:{n:'예절 바른 대응',e:'🌟',d:3,c:'var(--good)'},
  fun:{n:'선을 지킨 유머',e:'😄',d:2,c:'var(--fun)'},
  lazy:{n:'무성의한 대응',e:'😑',d:-2,c:'var(--lazy)'},
  hot:{n:'감정적·성급한 대응',e:'💢',d:-4,c:'var(--hot)'}
};

/*
  시나리오 형식
  p: 플랫폼, room: 방 이름, tag: 예절 영역, rel: 상대 관계(무작위 선택)
  ctx: 상황 설명, m: 처음 메시지들 [보내는사람, [문장 변형들]]  (p=상대, x=다른 친구, s=시스템)

*/
const S=[
{p:'kakao',room:'4학년 모둠 단톡방',tag:'주제',rel:['같은 모둠 친구','같은 반 친구'],
 ctx:'모둠 발표 준비 이야기를 하는데 {p}(이)가 갑자기 그림말을 도배하기 시작했어요.',
 m:[['x',['발표 역할 오늘 정해야 해!','우리 내일까지 발표 역할 정해야 함']],['p',['😂😂😂😂😂😂😂😂😂','🐷🐷🐷🐷🐷🐷 돼지 도배~~','ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ']]],
 c:[['hot',['야 도배 좀 그만해 진짜 짜증 나 🤬','아 진짜 왜 이래?? 그만하라고!!'],'뭐야 왜 화내… 장난이었는데 😠','화난 마음을 그대로 쏟으면 작은 장난이 큰 싸움이 돼요. 하고 싶은 말을 차분하게 전해 봐요.'],
    ['lazy',['…','(못 본 척 휴대폰을 내려놓는다)'],'🐷🐷🐷🐷🐷🐷 (도배 계속)','못 본 척하면 문제가 그대로예요. 대화가 엉뚱한 곳으로 흘러가면 부드럽게 알려 주는 게 좋아요.'],
    ['good',['{p}야, 그림말이 많으면 중요한 말이 위로 올라가서 안 보여 😅 우리 역할 먼저 정하자!'],'아 맞다 미안! 나는 자료 찾기 할게 🙋','이유를 설명하면서 대화 주제로 다시 돌아오게 했어요. 주제와 관련 없는 그림말을 반복하지 않는 것도 예절이에요.'],
    ['fun',['돼지 군단 출동 완료 🐷 이제 발표 군단도 출동해 볼까? 역할 정하자~'],'ㅋㅋㅋ 오케이 발표 군단 집합! 나 자료 찾기!','분위기는 살리면서 자연스럽게 주제로 돌아왔어요. 상대를 놀리지 않는, 선을 지킨 유머예요!']]},

{p:'video',room:'내 그림 그리기 영상 · 댓글',tag:'공손',rel:['처음 보는 사람','구독자'],

function beep(type){
  if(!sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const notes={msg:[660],good:[523,659,784],bad:[300,220],tap:[440]}[type]||[440];
    notes.forEach((f,k)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=type==='bad'?'triangle':'sine';o.frequency.value=f;
      const t=AC.currentTime+k*0.09;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.1,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.18);
    });
  }catch(e){}
}

  main.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;st.n=0;home()});
  main.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{st.n=+b.dataset.n;home()});
  $('go').onclick=start;
}

/* ============ 게임 진행 ============ */
function start(){
  beep('tap');
  let pool;
  if(st.mode==='long')pool=shuffle(STORIES).slice(0,st.n);
  else if(st.mode==='quick')pool=shuffle(SINGLES).slice(0,st.n);
  else{
    /* 섞어 하기: 카톡 긴 대화와 짧은 상황을 번갈아 */
    const a=shuffle(STORIES),b=shuffle(SINGLES);pool=[];
    for(let k=0;k<st.n;k++)pool.push(k%2===0&&a.length?a.pop():b.pop());
  }
  st.list=pool;
  st.total=pool.reduce((s,u)=>s+u.steps.length,0);
  Object.assign(st,{i:0,temp:36.5,combo:0,best:0,cnt:{good:0,fun:0,lazy:0,hot:0},weak:{},hist:[],busy:false});
  $('hud').hidden=false;
  round();
}

function fill(str,v){return str.replace(/\{(\w)\}/g,(m,k)=>v[k]!==undefined?v[k]:m)}

function makeVars(u){
  const ns=shuffle(NAMES),as=shuffle(AVS);
  const n={p:ns[0],x:ns[1],y:ns[2],z:ns[3]},a={p:as[0],x:as[1],y:as[2],z:as[3]},r={};
  for(const k of ['p','x','y','z']){
    const rv=u.rel&&u.rel[k];
    r[k]=Array.isArray(rv)?rnd(rv):(rv||'친구');
    if(u.cast&&u.cast[k]){n[k]=u.cast[k][0];a[k]=u.cast[k][1]}
  }
  const v={n,a,r,p:n.p,x:n.x,y:n.y,z:n.z};
  if(u.v)for(const k in u.v)v[k]=rnd(u.v[k]);
  return v;
}
let clock={h:0,m:0};
function tick(){clock.m+=1+Math.floor(Math.random()*3);if(clock.m>=60){clock.m-=60;clock.h=(clock.h+1)%24}const h=clock.h;return (h<12?'오전 ':'오후 ')+((h%12)||12)+':'+String(clock.m).padStart(2,'0')}

function round(){
  gen++;
  const u=st.list[st.i],v=makeVars(u);
  st.cur={u,v,si:0};st.busy=true;
  clock={h:15+Math.floor(Math.random()*5),m:Math.floor(Math.random()*40)};
  const pl=PLAT[u.p];
  const sub=u.group?`${pl.n} · 멤버 ${u.cast?5:5}명`:`${pl.n} · ${v.n.p} (${v.r.p})`;
  updHud();
  main.innerHTML=`<div class="win p-${u.p}">
    <div class="wh"><span class="pi">${pl.i}</span><div><div class="nm">${esc(fill(u.room,v))}</div><div class="sub">${esc(sub)}</div></div><span class="tag" id="tg"></span></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="panel" id="panel"><div class="ph">메시지를 기다리는 중…</div></div>
  </div>`;
  if(u.title)$('msgs').insertAdjacentHTML('beforeend',`<div class="sys">📖 ${esc(u.title)} · 장면 ${u.steps.length}개</div>`);
  playStep();
}

function split(t,def){const m=/^([pxyzs])\|/.exec(t);return m?[m[1],t.slice(2)]:[def,t]}

async function playStep(){
  const {u,v,si}=st.cur,step=u.steps[si];
  st.busy=true;
  updHud();
  $('tg').textContent=TAGS[step.tag].n;
  $('panel').innerHTML=`<div class="ph">💬 대화가 이어지는 중…</div>`;
  const multi=u.steps.length>1;
  $('msgs').insertAdjacentHTML('beforeend',`<div class="ctx"><b>${multi?'장면 '+(si+1)+' / '+u.steps.length:'상황 '+(st.i+1)}</b>${esc(fill(step.ctx,v))}</div>`);
  scrollDown();
  let seq=step.m.map(it=>Array.isArray(it)?[it[0],fill(rnd(it[1]),v)]:split(fill(it,v),'p'));
  /* 단톡방 수다: 장면 사이에 친구들 잡담을 끼워 넣어 대화를 더 길게 */
  if(u.group&&u.chat!==0&&si>0){
    const k=1+Math.floor(Math.random()*3),mem=['x','y','z'];
    const ch=shuffle(CHATTER).slice(0,k).map(t=>[rnd(mem),t]);
    seq=ch.concat(seq);
  }
  /* 돌발 멘트 */
  if(!u.ns&&Math.random()<.5){seq.push([u.group?rnd(['p','x','y','z']):'p',rnd(SURPRISE)])}
  const g=gen;
  for(const [w,t] of seq){if(g!==gen)return;await say(w,t,v)}
  if(g!==gen)return;
  showChoices(step,v);
}

function scrollDown(){const b=$('msgs');if(b)b.scrollTop=b.scrollHeight}

async function say(w,text,v){
  const box=$('msgs');if(!box)return;
  if(w==='s'){
    await wait(450);
    box.insertAdjacentHTML('beforeend',`<div class="sys">${esc(text)}</div>`);scrollDown();beep('msg');return;
  }
  const name=v.n[w],av=v.a[w],rel=v.r[w];
  const ty=document.createElement('div');
  ty.className='row typing in';
  ty.innerHTML=`<div class="av">${av}</div><div class="col"><div class="bub"><span></span><span></span><span></span></div></div>`;
  box.appendChild(ty);scrollDown();
  await wait(Math.min(1500,650+text.length*20));
  ty.className='row';
  ty.innerHTML=`<div class="av">${av}</div><div class="col"><div class="who">${esc(name)} <small>${esc(rel)}</small></div><div class="bub">${esc(text)}</div></div><span class="tm">${tick()}</span>`;
  requestAnimationFrame(()=>ty.classList.add('in'));
  scrollDown();beep('msg');
  await wait(250);
}

function showChoices(step,v){
  const opts=shuffle(step.c.map(([k,ts,r,f])=>({k,t:fill(Array.isArray(ts)?rnd(ts):ts,v),r:(Array.isArray(r)?r:[r]).map(x=>fill(x,v)),f:fill(f,v)})));
  st.cur.opts=opts;
  const p=$('panel');
  p.innerHTML=`<div class="ph">어떻게 답할까요? 하나를 골라요 👇</div>`+
    opts.map((o,i)=>`<button class="ch" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`).join('');
  p.querySelectorAll('.ch').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  scrollDown();
  st.busy=false;
}

async function choose(i){
  if(st.busy)return;st.busy=true;
  const {u,v,opts,si}=st.cur,step=u.steps[si],o=opts[i],K=KIND[o.k];
  const p=$('panel');
  p.querySelectorAll('.ch').forEach((b,j)=>{b.disabled=true;b.classList.add(j===i?'pick':'dim')});
  beep('tap');
  /* 내 말풍선 */
  const box=$('msgs');
  const me=document.createElement('div');me.className='row me';
  me.innerHTML=`<div class="col"><div class="bub">${esc(o.t)}</div></div><span class="tm">${tick()}</span>`;
  box.appendChild(me);requestAnimationFrame(()=>me.classList.add('in'));scrollDown();
  p.innerHTML=`<div class="ph">💬 친구들이 답장하는 중…</div>`;
  await wait(500);
  /* 반응들 */
  const g=gen;
  for(const r of o.r){if(g!==gen)return;const [w,t]=split(r,'p');await say(w,t,v)}
  if(g!==gen)return;
  /* 점수 */
  const ok=o.k==='good'||o.k==='fun';
  let d=K.d,bonus=0;
  if(ok){st.combo++;if(st.combo>=2){bonus=Math.min(2,0.5*(st.combo-1));d+=bonus}}else{st.combo=0;st.weak[step.tag]=(st.weak[step.tag]||0)+1}
  st.best=Math.max(st.best,st.combo);
  st.temp=Math.max(0,Math.round((st.temp+d)*10)/10);
  st.cnt[o.k]++;
  st.hist.push({p:u.p,k:o.k,tag:step.tag});
  beep(ok?'good':'bad');
  popDelta(d);updHud();
  /* 피드백 */
  const best=step.c.find(c=>c[0]==='good');
  const bestT=fill(Array.isArray(best[1])?best[1][0]:best[1],v);
  const moreStep=si+1<u.steps.length;
  const last=!moreStep&&st.i+1>=st.list.length;
  await wait(250);
  if(g!==gen)return;
  p.innerHTML=`<div class="fb">
      <div class="h j" style="color:${K.c}">${K.e} ${K.n}<span class="d">${d>0?'+':''}${d.toFixed(1)}°C</span></div>
      <p>${esc(o.f)}</p>
      ${!ok?`<div class="best"><b>이렇게 말해 보면 어때요?</b><br>${esc(bestT)}</div>`:''}
      ${bonus?`<p class="j" style="color:var(--fun)">🔥 ${st.combo}연속 매너 콤보! 보너스 +${bonus.toFixed(1)}°C</p>`:''}
    </div>
    <button class="next j" id="nx">${moreStep?'대화 계속하기 ▶ (장면 '+(si+2)+'/'+u.steps.length+')':last?'결과 보기 🏆':'다음 대화방으로 ▶'}</button>`;
  $('nx').onclick=()=>{
    beep('tap');
    if(moreStep){st.cur.si++;playStep();return}
    st.i++;if(st.i>=st.list.length)result();else round();
  };
  $('nx').focus({preventScroll:true});
}

function tempColor(t){return t<30?'#4c9bff':t<40?'#3ec07c':t<50?'#ffb020':t<60?'#ff7a3d':'#ff4f6d'}
function updHud(){
  const c=st.cur,u=c&&c.u;
  let txt=Math.min(st.i+1,st.list.length)+' / '+st.list.length;
  if(u&&u.steps.length>1)txt+=' · 장면 '+(c.si+1)+'/'+u.steps.length;
  $('rd').textContent=txt;
  $('tv').textContent=st.temp.toFixed(1)+'°C';
  const tb=$('tb');tb.style.width=Math.min(100,st.temp/(36.5+st.total*3.5)*100)+'%';tb.style.background=tempColor(st.temp);
  const cb=$('cb');cb.textContent='🔥 콤보 '+st.combo;cb.classList.toggle('on',st.combo>=2);
}
function popDelta(d){
  const p=$('pop');p.textContent=(d>0?'+':'')+d.toFixed(1)+'°C';p.style.color=d>0?'var(--good)':'var(--hot)';
  p.classList.remove('go');void p.offsetWidth;p.classList.add('go');
}

/* ============ 결과 화면 ============ */
function grade(t,n){
  const max=36.5+n*3+Math.max(0,n-1)*1.8; /* 대략적 최고점 */
  const r=(t-36.5)/(max-36.5);
  if(r>=.75)return{e:'🌈',g:'온라인 매너 천사',m:'어떤 상황에서도 예절을 지키는 최고의 대화 친구예요!'};
  if(r>=.5)return{e:'😎',g:'매너 고수',m:'대부분의 상황에서 멋지게 대화했어요. 조금만 더 다듬으면 매너 천사!'};
  if(r>=.25)return{e:'🌱',g:'매너 새싹',m:'좋은 대화 습관이 자라고 있어요. 피드백을 떠올리며 한 번 더 도전해 봐요.'};
  if(r>=0)return{e:'🙂',g:'매너 연습생',m:'온라인에서도 상대의 얼굴을 떠올리며 말해 보아요.'};
  return{e:'🧊',g:'꽁꽁 언 매너',m:'화면 너머에도 마음이 있는 사람이 있어요. 다시 도전해서 온도를 올려 봐요!'};
}
const STYLE={
  good:{n:'다정한 외교관형 🕊️',d:'차분하고 공손하게 내 생각을 전하는 대화 스타일이에요. 친구들이 믿고 이야기할 수 있어요.'},
  fun:{n:'센스 만점 분위기 메이커형 🎉',d:'유머로 분위기를 부드럽게 만들면서도 선을 지켜요. 웃음과 예절을 함께 챙기는 스타일!'},
  lazy:{n:'무심한 짧은 답장형 💤',d:'짧은 답이나 못 본 척이 많았어요. 온라인에서는 표정이 안 보이니 마음을 말로 더 표현해 봐요.'},
  hot:{n:'불꽃 키보드형 🔥',d:'감정이 먼저 튀어나왔어요. 보내기 전에 한 번 숨 쉬고 "이 말을 얼굴 보고도 할 수 있을까?" 생각해 봐요.'}
};
function result(){
  const n=st.hist.length||1,G=grade(st.temp,n);
  const order=['good','fun','lazy','hot'];
  const top=order.slice().sort((a,b)=>st.cnt[b]-st.cnt[a])[0];
  const wk=Object.keys(st.weak).sort((a,b)=>st.weak[b]-st.weak[a])[0];
  const pledge=wk?TAGS[wk].pledge:'저는 앞으로도 상대를 존중하며 온라인 대화를 할 거예요.';
  st.cur=null;
  $('rd').textContent='결과';
  main.innerHTML=`<div class="screen" style="justify-content:flex-start">
    <div class="res">
      <div class="grade"><div class="e">${G.e}</div><div class="g j">${G.g}</div><div class="t">매너 온도 <b style="color:${tempColor(st.temp)}">${st.temp.toFixed(1)}°C</b> · 선택 ${st.hist.length}번 · 최고 콤보 ${st.best}</div></div>
      <p style="margin:0;text-align:center">${G.m}</p>
      <div class="st">${order.map(k=>`<span style="color:${KIND[k].c}">${KIND[k].e} ${KIND[k].n.replace(' 대응','')}</span><div class="b"><i style="width:${st.cnt[k]/n*100}%;background:${KIND[k].c}"></i></div><span class="n">${st.cnt[k]}회</span>`).join('')}</div>
      <div class="box"><h3 class="j">나의 대화 스타일: ${STYLE[top].n}</h3><p>${STYLE[top].d}</p></div>
      <div class="box"><h3 class="j">${wk?'더 연습하면 좋은 예절: '+esc(TAGS[wk].n):'모든 예절을 잘 지켰어요! 👏'}</h3><p>${wk?esc(TAGS[wk].tip):'공손한 말씨, 주제 지키기, 사실 확인, 허락 구하기까지 모두 훌륭해요.'}</p></div>
      <div class="box"><h3 class="j">✍️ 추천 다짐</h3><p>"${esc(pledge)}"</p></div>
      <div><div class="ph" style="text-align:left;margin-bottom:6px">이번 대화 기록</div><div class="hist">${st.hist.map((h,i)=>`<span>${i+1}. ${PLAT[h.p].i} ${KIND[h.k].e}</span>`).join('')}</div></div>
    </div>
    <div class="btns"><button class="big j" id="again">다시하기 ↺</button><button class="opt" id="hm">처음 화면</button></div>
  </div>`;
  $('again').onclick=start;$('hm').onclick=home;
  beep(st.temp>=36.5?'good':'bad');
}

/* ============ 버튼 ============ */
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇'};
let rsArmed=0;
$('rs').onclick=()=>{ /* 두 번 누르면 처음 화면으로 (alert 대신) */
  const b=$('rs');
  if(Date.now()-rsArmed<2500){rsArmed=0;b.textContent='↺';st.cur=null;home();return}
  rsArmed=Date.now();b.textContent='한번 더';setTimeout(()=>{if(b.textContent==='한번 더')b.textContent='↺'},2500);
};
document.addEventListener('keydown',e=>{
  if(!st.cur||st.busy||!st.cur.opts)return;
  const m={'1':0,'2':1,'3':2,'4':3}[e.key];
  if(m!==undefined&&m<st.cur.opts.length&&$('panel').querySelector('.ch:not([disabled])'))choose(m);
});

home();
}

</script>
</body>
</html>
